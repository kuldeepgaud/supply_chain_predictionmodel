[project]
name = "supply-chain-predictionmodel"
version = "1.0.0"
description = "Regression problem"
readme = "README.md"
authors = [
    { name = "kuldeepgaud", email = "kuldeepgaud65@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "autogluon-tabular[all]>=1.6.1",
    "catboost>=1.2.10",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "xgboost>=3.2.0",
]

[project.scripts]
supply-chain-predictionmodel = "supply_chain_predictionmodel:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
